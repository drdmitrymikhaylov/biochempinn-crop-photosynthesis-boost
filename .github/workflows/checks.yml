name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  readme-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy scikit-learn pytest
      - run: python -m pytest tests -q
